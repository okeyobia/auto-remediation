---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: aiops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - "alert_rules.yml"

    scrape_configs:
      - job_name: "nginx"
        static_configs:
          - targets: ["nginx-exporter:9113"]

      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

  alert_rules.yml: |
    groups:
      - name: nginx_alerts
        rules:
          - alert: NginxDown
            expr: nginx_up == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              description: "Nginx service is down"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: aiops
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: 'webhook'
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h

    receivers:
      - name: 'webhook'
        webhook_configs:
          - url: 'http://webhook:5000/alert'
            send_resolved: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: aiops
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

      access_log /var/log/nginx/access.log main;

      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      keepalive_timeout 65;
      types_hash_max_size 2048;
      client_max_body_size 20M;

      gzip on;
      gzip_disable "msie6";

      server {
        listen 80;
        server_name _;

        location / {
          root /usr/share/nginx/html;
          index index.html index.htm;
        }

        # Prometheus metrics endpoint
        location /stub_status {
          stub_status;
          access_log off;
          allow all;
        }

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
          root /usr/share/nginx/html;
        }
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: aiops
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: aiops
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Nginx Dashboard'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
