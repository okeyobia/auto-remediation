---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-exporter
  namespace: aiops
  labels:
    app: nginx-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-exporter
  template:
    metadata:
      labels:
        app: nginx-exporter
    spec:
      containers:
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:latest
        args:
          - "-nginx.scrape-uri=http://nginx:80/stub_status"
        ports:
        - containerPort: 9113
          name: metrics
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9113
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9113
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-exporter
  namespace: aiops
  labels:
    app: nginx-exporter
spec:
  type: ClusterIP
  ports:
  - port: 9113
    targetPort: 9113
    protocol: TCP
    name: metrics
  selector:
    app: nginx-exporter
