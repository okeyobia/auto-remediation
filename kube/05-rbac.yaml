---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webhook-remediation
  namespace: aiops
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "statefulsets/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webhook-remediation
  namespace: aiops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webhook-remediation
subjects:
  - kind: ServiceAccount
    name: webhook
    namespace: aiops

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook
  namespace: aiops
